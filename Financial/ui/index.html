<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial — Lowell Nails</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        document.body.innerHTML = '<div style="padding:2rem;font-family:monospace;background:#fee2e2;color:#991b1b;border-radius:8px;margin:2rem">'
          + '<b>JS Error:</b><br>' + msg + '<br><br>'
          + (err && err.stack ? '<pre style="white-space:pre-wrap;font-size:12px">' + err.stack + '</pre>' : '')
          + '</div>';
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
